<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-63.07 -72.52 126.14 145.04" width="252.28" height="290.08" role="img" aria-labelledby="title desc">
  <title id="title">imagefluency logo</title>
  <desc id="desc">A hexagon filled with a simple landscape in dark reds: a dark red cog sets like a sun in the middle between mirrored hills, and the whole scene is reflected in still water. The package name is set in white on the water.</desc>

  <defs>
    <!-- Full-bleed hexagon with standard sticker proportions, no border -->
    <clipPath id="hex"><polygon points="0,-72.5 62.79,-36.25 62.79,36.25 0,72.5 -62.79,36.25 -62.79,-36.25"/></clipPath>
    <clipPath id="water"><rect x="-80" y="-10" width="160" height="100"/></clipPath>
    <clipPath id="cogclip"><circle cx="0" cy="-10" r="19"/></clipPath>
    <!-- The picture above the horizon (y = -10): cog, far hills, near hills. The right half of the hills mirrors the left -->
    <!-- Cog: tools/halftone.py gear 0 -10 18.5 14.2 6 10 -->
    <path id="cog" fill-rule="evenodd" d="M-2.4 -24L-1.74 -28.42L1.74 -28.42L2.4 -24L6.29 -22.73L9.42 -25.92L12.23 -23.88L10.17 -19.91L12.57 -16.61L16.98 -17.35L18.05 -14.04L14.05 -12.04L14.05 -7.96L18.05 -5.96L16.98 -2.65L12.57 -3.39L10.17 -0.09L12.23 3.88L9.42 5.92L6.29 2.73L2.4 4L1.74 8.42L-1.74 8.42L-2.4 4L-6.29 2.73L-9.42 5.92L-12.23 3.88L-10.17 -0.09L-12.57 -3.39L-16.98 -2.65L-18.05 -5.96L-14.05 -7.96L-14.05 -12.04L-18.05 -14.04L-16.98 -17.35L-12.57 -16.61L-10.17 -19.91L-12.23 -23.88L-9.42 -25.92L-6.29 -22.73ZM-6 -10a6 6 0 1 0 12 0a6 6 0 1 0 -12 0Z"/>
    <path id="far" d="M-80 -30C-66 -39 -52 -37 -40 -27C-30 -19 -22 -12 -11 -10H11C22 -12 30 -19 40 -27C52 -37 66 -39 80 -30V-10H-80Z"/>
    <path id="near" d="M-80 -19C-66 -25 -54 -23 -42 -17C-34 -13 -28 -10.6 -21 -10H21C28 -10.6 34 -13 42 -17C54 -23 66 -25 80 -19V-10H-80Z"/>
  </defs>

  <g clip-path="url(#hex)">
    <!-- Sky and the scene -->
    <rect x="-80" y="-90" width="160" height="80" fill="#a51e37"/>
    <use xlink:href="#cog" fill="#50000c"/>
    <use xlink:href="#far" fill="#7d1229"/><use xlink:href="#near" fill="#50000c"/>
    <!-- Water: the same scene mirrored at the horizon, darker -->
    <g clip-path="url(#water)">
      <rect x="-80" y="-10" width="160" height="100" fill="#821629"/>
      <g transform="translate(0 -20) scale(1 -1)">
        <use xlink:href="#cog" fill="#5c0613"/>
        <use xlink:href="#far" fill="#640d20"/><use xlink:href="#near" fill="#3e0009"/>
      </g>
      <!-- Ripples across the reflection of the cog -->
      <path clip-path="url(#cogclip)" d="M-20 -6.6H20M-20 -2.4H20M-20 2.4H20" fill="none" stroke="#821629" stroke-width="1.3"/>
    </g>
  </g>

